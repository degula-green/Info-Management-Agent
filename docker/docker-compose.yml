services:
  web:
    build: ../apps/web
    expose:
      - "80"

  core-service:
    build: ../services/core
    environment:
      CORE_REDIS_DATABASE: ${CORE_REDIS_DATABASE:-1}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://127.0.0.1:6379/1}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL:-postgresql://127.0.0.1:5432/info_agent}
      CORE_DATABASE_SCHEMA: ${CORE_DATABASE_SCHEMA:-public}
      CORE_MINIO_ENDPOINT: ${CORE_MINIO_ENDPOINT:-127.0.0.1:9000}
      CORE_MINIO_ACCESS_KEY: ${CORE_MINIO_ACCESS_KEY:-}
      CORE_MINIO_SECRET_KEY: ${CORE_MINIO_SECRET_KEY:-}
      CORE_MINIO_BUCKET: ${CORE_MINIO_BUCKET:-info-agent}
      CORE_MINIO_SECURE: ${CORE_MINIO_SECURE:-false}
      CORE_AVATAR_URL_TTL: ${CORE_AVATAR_URL_TTL:-15m}
      CORE_WEB_BASE_URL: ${CORE_WEB_BASE_URL:-http://localhost:5174}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-http://localhost:8080/api/connectors/feishu/callback}
      COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
    expose:
      - "8080"

  feishu-collector:
    build: ../services/collectors/feishu
    environment:
      FEISHU_WORKER_ENABLED: ${FEISHU_WORKER_ENABLED:-true}
      FEISHU_POLL_INTERVAL: ${FEISHU_POLL_INTERVAL:-60}
      FEISHU_PAGE_SIZE: ${FEISHU_PAGE_SIZE:-50}
      FEISHU_SOURCE_ACCOUNT_ID: ${FEISHU_SOURCE_ACCOUNT_ID:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      COLLECTOR_DATABASE_URL: ${COLLECTOR_DATABASE_URL:-postgresql://127.0.0.1:5432/info_agent}
      CORE_REDIS_URL: ${CORE_REDIS_URL:-redis://127.0.0.1:6379/1}
      CORE_REDIS_DATABASE: ${CORE_REDIS_DATABASE:-1}
      COLLECTOR_INTERNAL_TOKEN: ${COLLECTOR_INTERNAL_TOKEN:-local-development-only}
      MESSAGE_VALUE_EVALUATOR_URL: ${MESSAGE_VALUE_EVALUATOR_URL:-http://rag-service:8000/evaluate/message}
      MESSAGE_VALUE_TIMEOUT_SECONDS: ${MESSAGE_VALUE_TIMEOUT_SECONDS:-10}
    depends_on:
      - core-service
      - rag-service

  rag-service:
    build: ../services/rag
    environment:
      RAG_DATABASE_URL: ${RAG_DATABASE_URL:-}
      RAG_VECTOR_DIMENSION: ${RAG_VECTOR_DIMENSION:-1536}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      MESSAGE_VALUE_ENABLED: ${MESSAGE_VALUE_ENABLED:-true}
      MESSAGE_VALUE_API_BASE_URL: ${MESSAGE_VALUE_API_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      MESSAGE_VALUE_API_KEY: ${MESSAGE_VALUE_API_KEY:-}
      MESSAGE_VALUE_MODEL: ${MESSAGE_VALUE_MODEL:-qwen-plus}
      MESSAGE_VALUE_TIMEOUT_SECONDS: ${MESSAGE_VALUE_TIMEOUT_SECONDS:-10}
    expose:
      - "8000"
    depends_on:
      - elasticsearch

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ../gateway/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../gateway/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
      - core-service
      - rag-service

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "8081:8080"

volumes:
  elasticsearch-data:
